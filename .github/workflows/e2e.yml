# The end-to-end suite (e2e/, ADR 0006): a real Sandbox driven through the
# orcasm binary. Too slow for every PR, so it runs nightly on main, by hand,
# and from the Orca release watcher (orca-watch.yml) on each new Orca.
name: e2e

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      orca_version:
        description: Orca release under test (empty for the one the compatibility file picks)
        type: string
        required: false
      from_orca_version:
        description: Orca release to create the Sandbox with before upgrading to orca_version (empty for the same)
        type: string
        required: false
      ref:
        description: orcasm ref to build and test (empty for the triggering one)
        type: string
        required: false
  workflow_call:
    inputs:
      orca_version:
        type: string
        required: false
      from_orca_version:
        type: string
        required: false
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # msb boots Sandboxes with KVM, which standard Linux runners expose
      # once the runner user may open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the pinned msb
        run: internal/msb/install-msb.sh
      - name: End-to-end suite
        env:
          ORCASM_E2E: "1"
          ORCASM_E2E_ORCA: ${{ inputs.orca_version }}
          ORCASM_E2E_FROM_ORCA: ${{ inputs.from_orca_version }}
          ORCASM_E2E_NAME: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: go test -tags e2e -timeout 50m -v ./e2e/
